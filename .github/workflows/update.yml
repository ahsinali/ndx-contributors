name: Update dashboard

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC weekdays = 6:15pm EDT / 5:15pm EST, after the US close
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/log/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.build.outputs.status }}
      messages: ${{ steps.build.outputs.messages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test engine
        run: python -m pytest -q
      - name: Fetch data and build page
        id: build
        run: python -m ndx.build --out public
      - name: Save daily contribution log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/log data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update through latest close [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  reconcile:
    # The page is published either way (with a warning banner); this job fails so you get notified.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check contributions add up to the index move
        env:
          STATUS: ${{ needs.build.outputs.status }}
          MESSAGES: ${{ needs.build.outputs.messages }}
        run: |
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Dashboard check needed"
            printf '%s\n' "$MESSAGES"
            exit 1
          fi
          echo "Contributions reconcile to the index move."
